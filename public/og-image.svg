<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#22d3ee" fill-opacity="0.12"/>
    </pattern>
    <radialGradient id="glow" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#071014" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#071014"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Kicker + headline -->
  <text x="72" y="104" fill="#22d3ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0.08em">AMAZON ECS GATEWAY · WALKTHROUGH</text>
  <text x="72" y="180" fill="#eef8fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800">One gateway, not one</text>
  <text x="72" y="248" fill="#eef8fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800">ALB per service</text>

  <!-- Comparison diagram -->
  <g transform="translate(72,310)">
    <!-- Traditional -->
    <text x="0" y="0" fill="#5a7a86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.06em">TRADITIONAL</text>
    
    <rect x="0" y="20" width="150" height="46" rx="10" fill="#0d1b20" stroke="#1d3640" stroke-width="2"/>
    <text x="75" y="49" text-anchor="middle" fill="#b7cdd4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">ALB + cert</text>
    
    <rect x="0" y="90" width="150" height="46" rx="10" fill="#0d1b20" stroke="#1d3640" stroke-width="2"/>
    <text x="75" y="119" text-anchor="middle" fill="#b7cdd4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">ALB + cert</text>
    <line x1="150" y1="43" x2="214" y2="43" stroke="#1d3640" stroke-width="2"/>
    <line x1="150" y1="113" x2="214" y2="113" stroke="#1d3640" stroke-width="2"/>
    
    <rect x="214" y="20" width="140" height="46" rx="10" fill="#0d1b20" stroke="#1d3640" stroke-width="2"/>
    <text x="284" y="49" text-anchor="middle" fill="#b7cdd4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Service A</text>
    
    <rect x="214" y="90" width="140" height="46" rx="10" fill="#0d1b20" stroke="#1d3640" stroke-width="2"/>
    <text x="284" y="119" text-anchor="middle" fill="#b7cdd4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Service B</text>

    <!-- Divider arrow -->
    <text x="430" y="86" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700">→</text>

    <!-- With a gateway -->
    <text x="500" y="0" fill="#22d3ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.06em">WITH A GATEWAY</text>
    
    <rect x="500" y="55" width="190" height="46" rx="10" fill="#0e2730" stroke="#22d3ee" stroke-width="2"/>
    <text x="595" y="84" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Shared ALB + cert</text>
    <path d="M690 78 H740 M740 43 V113 M740 43 H782 M740 113 H782" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <rect x="782" y="20" width="140" height="46" rx="10" fill="#0d1b20" stroke="#1d3640" stroke-width="2"/>
    <text x="852" y="49" text-anchor="middle" fill="#b7cdd4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Service A</text>
    
    <rect x="782" y="90" width="140" height="46" rx="10" fill="#0d1b20" stroke="#1d3640" stroke-width="2"/>
    <text x="852" y="119" text-anchor="middle" fill="#b7cdd4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Service B</text>
  </g>

  <!-- Footer -->
  <text x="72" y="590" fill="#5a7a86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">ecs-gateway-walkthrough.johna.kiwi</text>
</svg>
